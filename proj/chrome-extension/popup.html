<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobTracker Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span>JobTracker</span>
    </div>
    <span class="badge" id="sourceBadge">1-Click Clip</span>
  </div>

  <!-- Auth section if not logged in -->
  <div id="authSection" class="section" style="display: none;">
    <p class="subtitle">Connect your JobTracker account to sync jobs directly to your board.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your.email@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="loginBtn">Connect Account</button>
  </div>

  <!-- Job Form section if logged in -->
  <div id="jobSection" class="section">
    <div class="job-meta-box">
      <div class="detected-tag">Detected from current tab</div>
      <div class="job-preview-title" id="previewTitle">Searching job on page...</div>
      <div class="job-preview-company" id="previewCompany">—</div>
    </div>

    <form id="jobForm">
      <div class="form-group">
        <label>Company *</label>
        <input type="text" id="companyName" required placeholder="e.g. Google, Microsoft">
      </div>

      <div class="form-group">
        <label>Role *</label>
        <input type="text" id="role" required placeholder="e.g. Senior Software Engineer">
      </div>

      <div class="row">
        <div class="form-group flex-1">
          <label>Status</label>
          <select id="status">
            <option value="SAVED" selected>Saved</option>
            <option value="APPLIED">Applied</option>
            <option value="INTERVIEW">Interview</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label>Workplace</label>
          <select id="locationType">
            <option value="REMOTE">Remote</option>
            <option value="HYBRID">Hybrid</option>
            <option value="ONSITE">On-site</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group flex-1">
          <label>Salary (optional)</label>
          <input type="text" id="salary" placeholder="e.g. 24 LPA, $150k">
        </div>
        <div class="form-group flex-1">
          <label>Tags (optional)</label>
          <input type="text" id="tags" placeholder="dream job, referral">
        </div>
      </div>

      <div class="form-group">
        <label>Job URL</label>
        <input type="url" id="jobUrl" placeholder="https://...">
      </div>

      <button type="submit" class="btn btn-primary" id="saveBtn">
        <span>Save to JobTracker</span>
      </button>
    </form>
  </div>

  <div class="footer">
    <a href="http://localhost:5173" target="_blank" class="footer-link">Open JobTracker Board ↗</a>
    <span class="user-status" id="userEmailTag"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
